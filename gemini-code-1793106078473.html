<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impiety</title>
<style>
:root{--bg:#0c0c0c;--line:#222;--text:#b8b8b8;--muted:#6b6b6b;--head:#e8e8e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.7 Georgia,'Times New Roman',serif}
main{max-width:600px;margin:0 auto;padding:3rem 1.2rem 4rem}
header{margin-bottom:3rem}
h1{font:600 1.1rem/1.2 system-ui,sans-serif;color:var(--head);margin:0}
.tag{font:.85rem system-ui,sans-serif;color:var(--muted);margin:.2rem 0 0}
.rule{display:none}
article{padding:0 0 2.5rem}
.date{font:.8rem system-ui,sans-serif;color:var(--muted);margin:0 0 .2rem}
h2{font:600 1.3rem/1.3 Georgia,serif;color:var(--head);margin:0 0 .8rem}
.body p{margin:0 0 1rem}
.body h3{font:600 1.05rem Georgia,serif;color:var(--head);margin:1.5rem 0 .5rem}
.body blockquote{margin:1rem 0;padding-left:1rem;border-left:2px solid var(--line);color:var(--muted)}
.body strong{color:var(--head)}
.empty{color:var(--muted);padding:1rem 0}
.bar{display:flex;gap:.5rem;margin:0 0 2rem;flex-wrap:wrap}
.row{display:flex;gap:.5rem;margin-top:.6rem}
button{font:.8rem system-ui,sans-serif;background:none;color:var(--muted);border:0;padding:.2rem .5rem .2rem 0;cursor:pointer;text-decoration:underline}
button:hover:not(:disabled){color:var(--head)}
button:disabled{opacity:.4;cursor:default}
.ed{margin:0 0 2rem}
.ed input,.ed textarea{width:100%;background:#141414;color:var(--head);border:1px solid var(--line);padding:.6rem;margin:0 0 .6rem;font:1rem/1.6 system-ui,sans-serif;outline:0;border-radius:0}
.ed input:focus,.ed textarea:focus{border-color:#444}
.ed textarea{min-height:240px;resize:vertical}
.hint,.status{font:.75rem system-ui,sans-serif;color:var(--muted);margin:0}
.status{margin-bottom:1rem}
main{padding-bottom:7rem}
main{padding-bottom:4rem;position:relative;z-index:1}
h1::after{content:'_';color:#9a2f2f;animation:blink 1.1s steps(1) infinite}
article{position:relative}
article::before{content:'';position:absolute;left:-14px;top:.4rem;bottom:2.6rem;width:1px;background:#9a2f2f;transform:scaleY(0);transform-origin:top;transition:transform .4s ease}
article:hover::before{transform:scaleY(1)}
h2{transition:color .3s}
article:hover h2{color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:1px;width:0;background:#9a2f2f;z-index:9;pointer-events:none}
#app.fresh article{animation:rise .8s ease both}
#app.fresh article:nth-child(2){animation-delay:.08s}
#app.fresh article:nth-child(3){animation-delay:.16s}
#app.fresh article:nth-child(4){animation-delay:.24s}
#app.fresh article:nth-child(n+5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){h1::after,#app.fresh article{animation:none}}
</style>
</head>
<body>
<main>
  <header id="top"></header>
  <div id="app"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBvvbZcQFj0no3raLI7lM5WN1e4ek_1mxk",
    authDomain: "unsigned-1b0a5.firebaseapp.com",
    projectId: "unsigned-1b0a5",
    storageBucket: "unsigned-1b0a5.firebasestorage.app",
    messagingSenderId: "804679217803",
    appId: "1:804679217803:web:7327aa657dcf81d2861a8e",
    measurementId: "G-9WZ42RVXPW"
  };

  const appFirebase = initializeApp(firebaseConfig);
  const db = getFirestore(appFirebase);

  let state = {title: 'Impiety', tagline: 'Notes from the dark', posts: []};
  const top = document.getElementById('top'), app = document.getElementById('app');
  let owner = false, editing = null, busy = false, status = 'different sinners sin differently';

  window.unlock = function(pw) {
    if (btoa(pw) === 'YWRtaW4=') {
      owner = true;
      console.log('Unlocked.');
      render();
    }
  };

  async function loadData() {
    try {
      const siteSnap = await getDocs(collection(db, "site"));
      siteSnap.forEach(d => {
        if(d.id === 'info') {
          state.title = d.data().title || state.title;
          state.tagline = d.data().tagline || state.tagline;
        }
      });
      
      const postsSnap = await getDocs(collection(db, "posts"));
      state.posts = [];
      postsSnap.forEach(d => {
        state.posts.push({ id: d.id, ...d.data() });
      });
      state.posts.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
      status = '';
    } catch(e) {
      status = 'Could not load data. Ensure Firestore rules allow reading.';
    }
    render();
  }

  async function saveHeader(title, tagline) {
    if(busy) return; busy = true; status = 'Saving header...'; render();
    try {
      await setDoc(doc(db, "site", "info"), { title, tagline });
      state.title = title; state.tagline = tagline;
      status = 'Header saved!';
    } catch(e) { status = 'Error saving header.'; }
    busy = false; editing = null; render();
  }

  async function savePost(p) {
    if(busy) return; busy = true; status = 'Saving post...'; render();
    try {
      await setDoc(doc(db, "posts", p.id), { title: p.title, date: p.date, body: p.body });
      let existing = state.posts.find(x => x.id === p.id);
      if(existing) { Object.assign(existing, p); } 
      else { state.posts.unshift(p); }
      state.posts.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
      status = 'Post saved!';
    } catch(e) { status = 'Error saving post.'; }
    busy = false; editing = null; render();
  }

  async function delPost(id) {
    if(busy) return; busy = true; status = 'Deleting post...'; render();
    try {
      await deleteDoc(doc(db, "posts", id));
      state.posts = state.posts.filter(x => x.id !== id);
      status = 'Post deleted!';
    } catch(e) { status = 'Error deleting post.'; }
    busy = false; editing = null; render();
  }

  function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function btn(label,cls,fn){var b=$('button',cls,label);b.disabled=busy;b.addEventListener('click',fn);return b}
  function inline(p,el){p.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(function(s){
    if(!s)return;
    if(s.length>4&&s.slice(0,2)==='**'&&s.slice(-2)==='**')el.appendChild($('strong',null,s.slice(2,-2)));
    else if(s.length>2&&s[0]==='*'&&s.slice(-1)==='*')el.appendChild($('em',null,s.slice(1,-1)));
    else el.appendChild(document.createTextNode(s))})}
  function body(text){var w=$('div','body');
    text.split(/\n{2,}/).forEach(function(b){b=b.trim();if(!b)return;var el;
      if(b.slice(0,3)==='## '){el=$('h3');inline(b.slice(3),el)}
      else if(b.slice(0,2)==='> '){el=$('blockquote');inline(b.slice(2).replace(/\n> ?/g,' '),el)}
      else{el=$('p');inline(b,el)}
      w.appendChild(el)});return w}
  function fmt(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  function editor(post){
    var p=post||{id:Date.now().toString(36),date:today(),title:'',body:''};
    var box=$('div','ed'),t=$('input'),d=$('input'),b=$('textarea');
    t.placeholder='Title';t.value=p.title;d.type='date';d.value=p.date;b.placeholder='Write…';b.value=p.body;
    box.append(t,d,b,$('p','hint','Blank line = new paragraph · **bold** · *italic* · ## heading · > quote'));
    var r=$('div','row');
    r.append(btn('Save','go',function(){
      savePost({id:p.id,date:d.value||today(),title:t.value.trim()||'Untitled',body:b.value});
    }),btn('Cancel','',function(){editing=null;render()}));
    box.appendChild(r);return box}

  function headEditor(){
    var box=$('div','ed'),t=$('input'),g=$('input');
    t.value=state.title;t.placeholder='Site name';g.value=state.tagline;g.placeholder='Tagline';
    box.append(t,g);var r=$('div','row');
    r.append(btn('Save','go',function(){
      saveHeader(t.value.trim()||'Untitled', g.value.trim());
    }),btn('Cancel','',function(){editing=null;render()}));
    box.appendChild(r);return box}

  function render(){
    top.textContent='';app.textContent='';
    document.title=state.title;
    top.append($('h1',null,state.title));
    if(state.tagline)top.append($('p','tag',state.tagline));
      if(status)app.append($('p','status',status));
    if(owner){
      var bar=$('div','bar');
      bar.append(btn('+ New post','go',function(){editing='new';render()}),btn('Edit header','',function(){editing='head';render()}));
      app.append(bar)}
    if(owner&&editing==='head')app.append(headEditor());
    if(owner&&editing==='new')app.append(editor(null));
    if(!state.posts.length && !status)app.append($('p','empty','Silence, for now.'));
    state.posts.forEach(function(p){
      if(owner&&editing===p.id){app.append(editor(p));return}
      var a=$('article');
      a.append($('p','date',fmt(p.date)),$('h2',null,p.title),body(p.body));
      if(owner){var r=$('div','row');
        r.append(btn('Edit','',function(){editing=p.id;render()}),
          btn('Delete','del',function(){
            if(this.dataset.arm){delPost(p.id)}
            else{this.dataset.arm='1';this.textContent='Confirm?'}
          }));
        a.append(r)}
      app.append(a)})}

  render();
  loadData();

  (function(){
    var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
    app.classList.add('fresh');setTimeout(function(){app.classList.remove('fresh')},2500);
    var prog=document.createElement('div');prog.id='prog';document.body.appendChild(prog);
    function sc(){var h=document.documentElement.scrollHeight-innerHeight;prog.style.width=(h>0?scrollY/h*100:0)+'%'}
    addEventListener('scroll',sc,{passive:true});sc();
    if(rm)return;
    var cv=document.createElement('canvas');cv.id='fx';document.body.insertBefore(cv,document.body.firstChild);
    var ctx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),mx=-999,my=-999,ps=[];
    function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
    function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.4,vy:-(Math.random()*.15+.03),vx:(Math.random()-.5)*.08,a:Math.random()*.3+.08}}
    size();for(var i=0;i<45;i++)ps.push(mk());
    addEventListener('resize',size);
    addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;},{passive:true});
    document.addEventListener('pointerleave',function(){mx=my=-999});
    function tick(){
      if(!document.hidden){
        ctx.clearRect(0,0,W,H);
        ps.forEach(function(p){
          var dx=p.x-mx,dy=p.y-my,d=Math.sqrt(dx*dx+dy*dy);
          if(d>0&&d<110){var f=(110-d)/110;p.x+=dx/d*f*1.6;p.y+=dy/d*f*1.6}
          p.x+=p.vx;p.y+=p.vy;
          if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
          if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
          ctx.fillStyle='rgba(205,200,190,'+p.a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()})}
      requestAnimationFrame(tick)}
    tick();
  })();
</script>
</body>
</html>
